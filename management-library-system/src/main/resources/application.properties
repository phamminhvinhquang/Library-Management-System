# 1. Cấu hình cổng chạy ứng dụng Backend
server.port=8086

# 2. Cấu hình Tên Ứng Dụng
spring.application.name=management-library-system

# 3. Cấu hình Kết nối Cơ sở dữ liệu MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/library_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=1176
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# 5. Cấu hình hiển thị log SQL bên dưới Console để theo dõi
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true