<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản Lý Mượn Sách - Thư Viện Sách</title>
    <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
    <link rel="stylesheet" href="css/borrow_management.css" />
  </head>
  <body>
    <div class="management-container">
      <div class="top-bar">
        <div class="header-left">
          <iconify-icon icon="solar:book-bookmark-bold-duotone"></iconify-icon>
          <h2>Quản Lí Mượn Sách</h2>
        </div>
        <a href="index.html" class="btn-back">
          <iconify-icon icon="solar:arrow-left-linear"></iconify-icon> Quay Lại
        </a>
      </div>

      <div class="management-card">
        <div class="toolbar">
          <input
            type="text"
            id="searchInput"
            class="search-input"
            placeholder="Tìm kiếm theo mã phiếu..."
          />
          <button id="btnSearch" class="btn-search">
            <iconify-icon icon="ph:magnifying-glass-bold"></iconify-icon> Tìm
            Kiếm
          </button>
        </div>

        <div class="table-responsive">
          <table class="borrow-table">
            <thead>
              <tr>
                <th>Mã Phiếu</th>
                <th>Người Mượn</th>
                <th>Ngày Mượn</th>
                <th>Ngày Trả Dự Kiến</th>
                <th>Số Sách</th>
                <th>Trạng Thái</th>
                <th>Thao Tác</th>
              </tr>
            </thead>
            <tbody id="borrowTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <div id="ticketDetailModal" class="modal-overlay">
      <div class="modal-content">
        <h3 class="modal-title">
          Chi Tiết Phiếu Mượn <span id="modalTicketId"></span>
        </h3>
        <div id="modalTicketBooks" class="modal-body"></div>
        <div class="modal-footer">
          <button class="btn-close" onclick="closeTicketModal()">Đóng</button>
        </div>
      </div>
    </div>

    <script src="js/borrow_management.js"></script>
  </body>
</html>
