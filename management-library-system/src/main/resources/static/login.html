<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng Nhập - Thư Viện Sách</title>
    <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
    <link rel="stylesheet" href="css/login.css" />
  </head>
  <body>
    <div class="auth-container">
      <a href="index.html" class="back-link">
        <iconify-icon icon="solar:arrow-left-linear"></iconify-icon> Trở về
        trang chủ
      </a>
      <div class="auth-card">
        <div class="auth-header">
          <iconify-icon
            icon="solar:book-open-bold-duotone"
            class="auth-logo"
          ></iconify-icon>
          <h2>Chào mừng trở lại!</h2>
          <p>Vui lòng đăng nhập để tiếp tục mượn sách</p>
        </div>

        <form id="loginForm">
          <div class="form-group">
            <label for="email">Địa chỉ Email</label>
            <div class="input-wrapper">
              <iconify-icon icon="solar:letter-linear"></iconify-icon>
              <input
                type="email"
                id="email"
                placeholder="example@gmail.com"
                required
              />
            </div>
          </div>

          <div class="form-group">
            <label for="password">Mật khẩu</label>
            <div class="input-wrapper">
              <iconify-icon icon="solar:lock-password-linear"></iconify-icon>
              <input
                type="password"
                id="password"
                placeholder="••••••••"
                required
              />
            </div>
          </div>

          <button type="submit" class="btn-auth">Đăng Nhập</button>
        </form>

        <div class="auth-footer">
          Chưa có tài khoản? <a href="register.html">Đăng ký ngay</a>
        </div>
      </div>
    </div>
    <script src="js/login.js"></script>
  </body>
</html>
