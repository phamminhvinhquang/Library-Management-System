<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng Ký Tài Khoản - Thư Viện Sách</title>
    <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
    <link rel="stylesheet" href="css/login.css" />
  </head>
  <body>
    <div class="auth-container">
      <a href="index.html" class="back-link">
        <iconify-icon icon="solar:arrow-left-linear"></iconify-icon> Trở về
        trang chủ
      </a>
      <div class="auth-card">
        <div class="auth-header">
          <iconify-icon
            icon="solar:user-plus-rounded-bold-duotone"
            class="auth-logo"
          ></iconify-icon>
          <h2>Tạo Tài Khoản Mới</h2>
          <p>Khám phá kho tàng sách tri thức miễn phí</p>
        </div>

        <form id="registerForm">
          <div class="form-group">
            <label for="fullName">Họ và Tên</label>
            <div class="input-wrapper">
              <iconify-icon icon="solar:user-linear"></iconify-icon>
              <input
                type="text"
                id="fullName"
                placeholder="Nguyễn Văn A"
                required
              />
            </div>
          </div>

          <div class="form-group">
            <label for="email">Địa chỉ Email</label>
            <div class="input-wrapper">
              <iconify-icon icon="solar:letter-linear"></iconify-icon>
              <input
                type="email"
                id="email"
                placeholder="example@gmail.com"
                required
              />
            </div>
          </div>

          <div class="form-group">
            <label for="password">Mật khẩu</label>
            <div class="input-wrapper">
              <iconify-icon icon="solar:lock-password-linear"></iconify-icon>
              <input
                type="password"
                id="password"
                placeholder="Nhập mật khẩu "
                required
              />
            </div>
          </div>

          <div class="form-group">
            <label for="phoneNumber">Số điện thoại</label>
            <div class="input-wrapper">
              <iconify-icon icon="solar:phone-linear"></iconify-icon>
              <input type="text" id="phoneNumber" placeholder="Nhập số điện" />
            </div>
          </div>

          <div class="form-group">
            <label for="address">Địa chỉ cư trú</label>
            <div class="input-wrapper">
              <iconify-icon icon="solar:map-point-linear"></iconify-icon>
              <input
                type="text"
                id="address"
                placeholder="Nhập địa chỉ"
              />
            </div>
          </div>

          <button type="submit" class="btn-auth">Đăng Ký</button>
        </form>

        <div class="auth-footer">
          Đã có tài khoản? <a href="login.html">Đăng nhập</a>
        </div>
      </div>
    </div>
    <script src="js/register.js"></script>
  </body>
</html>
