<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Thông tin tài khoản - Thư Viện Sách</title>
    <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
    <link rel="stylesheet" href="css/account_detail.css" />
  </head>
  <body>
    <div class="account-container">
      <a href="index.html" class="back-link">
        <iconify-icon icon="solar:arrow-left-linear"></iconify-icon> Trở về
        trang chủ
      </a>

      <div class="account-card">
        <div class="account-header">
          <h2>Hồ Sơ Của Tôi</h2>
          <p>Quản lý thông tin cá nhân và bảo mật tài khoản</p>
        </div>

        <div class="account-content">
          <div class="avatar-section">
            <div class="avatar-wrapper">
              <img
                id="avatarPreview"
                src="https://ui-avatars.com/api/?name=User&background=f0c39f&color=000&size=150"
                alt="Avatar"
              />

              <label
                for="avatarInput"
                class="avatar-upload-btn"
                title="Cập nhật ảnh đại diện"
              >
                <iconify-icon icon="solar:camera-linear"></iconify-icon>
              </label>
              <input
                type="file"
                id="avatarInput"
                accept="image/png, image/jpeg"
                style="display: none"
              />
            </div>
            <div id="displayRole" class="role-badge">Độc giả</div>
          </div>

          <div class="info-section">
            <form id="profileForm">
              <h3 class="section-title">Thông tin cơ bản</h3>

              <div class="form-group">
                <label for="fullName">Họ và Tên</label>
                <div class="input-wrapper">
                  <iconify-icon icon="solar:user-linear"></iconify-icon>
                  <input
                    type="text"
                    id="fullName"
                    placeholder="Nhập tên mới..."
                    required
                  />
                </div>
              </div>

              <div class="form-group">
                <label for="email">Địa chỉ Email</label>
                <div class="input-wrapper disabled">
                  <iconify-icon icon="solar:letter-linear"></iconify-icon>
                  <input
                    type="email"
                    id="email"
                    disabled
                    title="Email dùng để đăng nhập nên không thể sửa"
                  />
                </div>
              </div>

              <button type="submit" class="btn-save">Lưu thông tin</button>
            </form>

            <div class="divider"></div>

            <form id="passwordForm">
              <h3 class="section-title">Đổi mật khẩu</h3>

              <div class="form-group">
                <label for="currentPassword">Mật khẩu hiện tại</label>
                <div class="input-wrapper">
                  <iconify-icon
                    icon="solar:lock-password-linear"
                  ></iconify-icon>
                  <input
                    type="password"
                    id="currentPassword"
                    placeholder="••••••••"
                    required
                  />
                </div>
              </div>

              <div class="form-group">
                <label for="newPassword">Mật khẩu mới</label>
                <div class="input-wrapper">
                  <iconify-icon icon="solar:lock-password-bold"></iconify-icon>
                  <input
                    type="password"
                    id="newPassword"
                    placeholder="Tối thiểu 6 ký tự"
                    required
                  />
                </div>
              </div>

              <button type="submit" class="btn-save btn-password">
                Cập nhật mật khẩu
              </button>
            </form>
          </div>
        </div>
      </div>
    </div>

    <script src="js/account_detail.js"></script>
  </body>
</html>
