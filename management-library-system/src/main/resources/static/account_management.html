<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản Lý Tài Khoản - Thư Viện Sách</title>
    <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
    <link rel="stylesheet" href="css/account_management.css" />
  </head>
  <body>
    <div class="management-container">
      <a href="index.html" class="back-link">
        <iconify-icon icon="solar:arrow-left-linear"></iconify-icon> Trở về
        trang chủ
      </a>

      <div class="management-header">
        <iconify-icon icon="ph:users-three-bold"></iconify-icon>
        <h2>Quản Lý Tài Khoản</h2>
      </div>

      <div class="management-card">
        <div class="toolbar">
          <input
            type="text"
            id="searchInput"
            class="search-input"
            placeholder="Tìm kiếm theo tên đăng nhập, mã tài khoản, họ tên..."
          />

          <select id="roleFilter" class="role-filter">
            <option value="ALL">Tất cả vai trò</option>
            <option value="ROLE_ADMIN">Admin</option>
            <option value="ROLE_STAFF">Nhân viên</option>
            <option value="ROLE_USER">Độc giả</option>
          </select>

          <button id="btnSearch" class="btn-search">
            <iconify-icon icon="ph:magnifying-glass-bold"></iconify-icon> Tìm
            kiếm
          </button>
          <button id="btnReset" class="btn-reset">
            <iconify-icon icon="ph:arrow-counter-clockwise-bold"></iconify-icon>
            Làm mới
          </button>
        </div>

        <div class="table-responsive">
          <table class="account-table">
            <thead>
              <tr>
                <th>Mã TK</th>
                <th>Tên Đăng Nhập</th>
                <th>Vai Trò</th>
                <th>Họ Tên</th>
                <th>Trạng Thái</th>
                <th>Thao Tác</th>
              </tr>
            </thead>
            <tbody id="accountTableBody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <script src="js/account_management.js"></script>
  </body>
</html>
