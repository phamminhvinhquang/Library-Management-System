<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý tài khoản</title>

    <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>

    <link rel="stylesheet" href="css/header.css">
    <link rel="stylesheet" href="css/footer.css">
    <link rel="stylesheet" href="css/account.css">
</head>

<body>

    <!-- Header -->
    <header class="header">

        <a href="book.html" class="logo-container">
            <iconify-icon icon="solar:book-open-bold-duotone"></iconify-icon>
            <span>Thư viện sách</span>
        </a>

    </header>


    <main class="account-container">

    <div class="page-title">
        <iconify-icon icon="solar:user-linear"></iconify-icon>
        <h1>Quản Lý Tài Khoản</h1>
    </div>

    <div class="toolbar">

        <input
            type="text"
            id="searchInput"
            placeholder="Tìm kiếm theo tên đăng nhập, mã tài khoản, họ tên..."
        >

        <select id="roleFilter">
            <option value="">Tất cả vai trò</option>
            <option value="Admin">Admin</option>
            <option value="Độc giả">Độc giả</option>
        </select>

        <button id="searchBtn">
            <iconify-icon icon="solar:magnifer-linear"></iconify-icon>
            Tìm kiếm
        </button>

        <button id="refreshBtn">
            <iconify-icon icon="solar:refresh-linear"></iconify-icon>
            Làm mới
        </button>

    </div>

    <div class="table-wrapper">

        <table id="accountTable">

            <thead>
                <tr>
                    <th>Mã TK</th>
                    <th>Tên Đăng Nhập</th>
                    <th>Vai Trò</th>
                    <th>Họ Tên</th>
                    <th>Trạng Thái</th>
                    <th>Thao Tác</th>
                </tr>
            </thead>

            <tbody id="accountTableBody">

<tr>
    <td>TKADMIN01</td>
    <td>Nguyễn Thanh Tùng</td>
    <td><span class="role admin">Admin</span></td>
    <td>N/A</td>
    <td><span class="status active">Hoạt động</span></td>
    <td class="action-buttons">
        <button class="view-btn">
            <iconify-icon icon="solar:eye-linear"></iconify-icon>
        </button>

        <button class="edit-btn">
            <iconify-icon icon="solar:pen-linear"></iconify-icon>
        </button>
    </td>
</tr>

<tr>
    <td>TK002</td>
    <td>Nguyễn Văn B</td>
    <td><span class="role reader">Độc giả</span></td>
    <td>Nguyễn Văn B</td>
    <td><span class="status active">Hoạt động</span></td>
    <td class="action-buttons">
        <button class="view-btn">
            <iconify-icon icon="solar:eye-linear"></iconify-icon>
        </button>

        <button class="edit-btn">
            <iconify-icon icon="solar:pen-linear"></iconify-icon>
        </button>

        <button class="delete-btn">
            <iconify-icon icon="solar:trash-bin-trash-linear"></iconify-icon>
        </button>
    </td>
</tr>

<tr>
    <td>TK001</td>
    <td>Nguyễn Văn A</td>
    <td><span class="role reader">Độc giả</span></td>
    <td>Nguyễn Văn A</td>
    <td><span class="status active">Hoạt động</span></td>
    <td class="action-buttons">
        <button class="view-btn">
            <iconify-icon icon="solar:eye-linear"></iconify-icon>
        </button>

        <button class="edit-btn">
            <iconify-icon icon="solar:pen-linear"></iconify-icon>
        </button>

        <button class="delete-btn">
            <iconify-icon icon="solar:trash-bin-trash-linear"></iconify-icon>
        </button>
    </td>
</tr>

</tbody>

        </table>

    </div>

</main>



    <!-- Footer -->
    <footer class="footer">
        <div class="footer-container">

            <div class="footer-column">
                <div class="footer-logo">
                    <iconify-icon icon="solar:book-open-bold-duotone"></iconify-icon>
                    <span>Thư viện sách</span>
                </div>

                <p>
                    Hệ thống quản lý thư viện trực tuyến.
                </p>
            </div>

        </div>
    </footer>

    <script src="js/account.js"></script>

</body>
</html>
